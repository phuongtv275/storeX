server:
  port: 8082

spring:
  application:
    name: product-service-test
  cache:
    type: none
  datasource:
    url: jdbc:h2:mem:storextest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
