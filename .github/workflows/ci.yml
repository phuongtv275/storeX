name: Cart Service CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Build with Gradle
        run: |
          ./notification-service/gradlew bootJar
          ./order-service/gradlew bootJar
          ./product-service/gradlew bootJar
          ./restaurant-service/gradlew bootJar
          ./user-service/gradlew bootJar
