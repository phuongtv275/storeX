name: Cart Service CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Build with Gradle
        run: |
          cd ./notification-service && ./gradlew bootJar && cd ..
          cd ./order-service && ./gradlew bootJar && cd ..
          cd ./product-service && ./gradlew bootJar && cd ..
          cd ./restaurant-service && ./gradlew bootJar && cd ..
          cd ./user-service && ./gradlew bootJar && cd ..
