image: gradle:7.6-jdk17

stages:
  - test
  - build

variables:
  # Cấu hình biến môi trường khởi tạo cho PostgreSQL container
  POSTGRES_DB: hr_management_test
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  # Cấu hình để PostgreSQL bỏ qua lỗi host nếu cần và Gradle tối ưu cache
  POSTGRES_HOST_AUTH_METHOD: trust
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

test_job:
  stage: test
  services:
    - name: postgres:14-alpine
      alias: postgres
  variables:
    # Truyền thông tin kết nối DB cho ứng dụng Spring Boot / Java khi chạy Integration Test
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/$POSTGRES_DB
    SPRING_DATASOURCE_USERNAME: $POSTGRES_USER
    SPRING_DATASOURCE_PASSWORD: $POSTGRES_PASSWORD
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew test

build_job:
  stage: build
  needs:
    - test_job
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew build -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 day